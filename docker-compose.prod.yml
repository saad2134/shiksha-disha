version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shikshadisha
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build: ./backend/gateway
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - core-service
      - ai-engine-service
      - ai-companion-service
    restart: unless-stopped

  core-service:
    build: ./backend/services/core-service
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shikshadisha
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-defaultsecretkeyforshikshadisha2026}
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai-engine-service:
    build: ./backend/services/ai-engine-service
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shikshadisha
      NSQF_COURSES_PATH: ./data/nsqf_courses.csv
    volumes:
      - ./backend/services/ai-engine-service/data:/app/data
      - ./backend/services/ai-engine-service/models:/app/models
    restart: unless-stopped

  ai-companion-service:
    build: ./backend/services/ai-companion-service
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        BACKEND_BASE_URL: ${BACKEND_INTERNAL_URL:-http://gateway:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ${WEB_ENV_FILE:-./web/.env}
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-defaultnextauthsecret}
      BACKEND_BASE_URL: ${BACKEND_INTERNAL_URL:-http://gateway:8000}
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
